<!DOCTYPE html>
<html><head><meta charset="utf-8"></head>
<body style="margin:0">
<script>
  // Memoria del "Ricordami" nel browser (localStorage), condivisa da tutte le pagine dell'app
  const CHIAVE = "ls_ricordami";
  function invia(tipo, dati) { window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: tipo }, dati), "*"); }
  let ultimo = null;
  window.addEventListener("message", (e) => {
    if (!e.data || e.data.type !== "streamlit:render") return;
    const a = e.data.args || {};
    const firma = JSON.stringify(a);
    if (firma === ultimo) return;
    ultimo = firma;
    try {
      if (a.azione === "scrivi" && a.valore) localStorage.setItem(CHIAVE, a.valore);
      if (a.azione === "cancella") localStorage.removeItem(CHIAVE);
    } catch (err) {}
    let token = "";
    try { token = localStorage.getItem(CHIAVE) || ""; } catch (err) {}
    invia("streamlit:setComponentValue", { value: { token: token, azione: a.azione || "leggi" }, dataType: "json" });
  });
  invia("streamlit:componentReady", { apiVersion: 1 });
  invia("streamlit:setFrameHeight", { height: 0 });
</script>
</body></html>
